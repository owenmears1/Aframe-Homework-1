<!DOCTYPE html>
<html>
    <head> 
        <title>A Simple Scene</title> 
        <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> 

        </script>
        </head>
        <body> 
            <a-scene>
              <a-assets>
                <img id="grass-base" src="assets/Grass_001_COLOR.jpg">
                <img id="grass-normal" src="assets/Grass_001_NORM.jpg">
                <img id="grass-ambient-occlusion" src="assets/Grass_001_OCC.jpg">
                <img id="sky" src="assets/Sky.jpg">
                <img id="brick" src="assets/Brick_COLOR.jpg">
                <img id="shingles" src="assets/Shingles_COLOR.jpg">
                <img id="bark" src="assets/Bark_COLOR.jpg">
                <img id="pine-needles" src="assets/PineNeedles_COLOR.jpg">
                <img id="leaves" src="assets/Leaves_COLOR.jpg">
                <a-asset-item
           id="chair"
           src="assets/chair.glb">
          </a-asset-item>  
          <a-asset-item id="soldier" src="assets/Soldier.glb"></a-asset-item>
          <a-asset-item id="helmet" src="assets/DamagedHelmet.glb"></a-asset-item>
          <a-asset-item id="water-bottle" src="assets/WaterBottle.glb"></a-asset-item>
          <a-asset-item id="radio" src="assets/BoomBox.glb"></a-asset-item>
          <a-asset-item id="lantern" src="assets/Lantern.glb"></a-asset-item>
            </a-assets>
             
          
          <a-plane
                material="src: #grass-base;
                          repeat: 500 500;
                          normalMap: #grass-normal;
                          normalTextureRepeat: 500 500;
                          ambientOcclusionMap: #grass-ambient-occlusion;
                          ambientOcclusionTextureRepeat: 500 500"
                position="0 0 -8"rotation="-90 0 0"width="500"height="500">
              </a-plane>
            <a-sky 
              src="#sky">
            </a-sky>
                  <a-mixin
                        id="brickwall"
                        material="src: #brick; repeat: 3 1">
                  </a-mixin>
                      <a-box
                      mixin="brickwall"
                      position="0 1.5 -16"
                      rotation="0 0 0"
                      width="10"
                      height="3"
                      depth="0.1">
                    </a-box>
               <a-box
               mixin="brickwall"
               position="-5 1.5 -11"
               rotation="0 90 0"
               width="10"
               height="3"
               depth="0.1">
            </a-box>
            <a-box
            mixin="brickwall"
            position="5 1.5 -11"
            rotation="0 90 0"
            width="10"
            height="3"
            depth="0.1">
        </a-box>
       <a-box
       mixin="brickwall"
       material="repeat: 1.3 1"
       position="-2.875 1.5 -6"
       rotation="0 0 0"
       width="4.25"
       height="3"
       depth="0.1">
    </a-box>
  <a-box
  mixin="brickwall"
  material="repeat: 1.3 1"
  position="2.875 1.5 -6"
  rotation="0 0 0"
  width="4.25"
  height="3"
  depth="0.1">
</a-box>
<a-box
mixin="brickwall"
material="repeat: 0.45 0.17"
position="0 2.75 -6"
rotation="0 0 0"
width="1.5"
height="0.5"
depth="0.1">
</a-box>
<a-box
color="tan"
position="0 0 -11"
width="10"
depth="10"
height="0.1">
</a-box>
<a-box
material="src: #shingles; repeat: 4 4"
position="0 3 -11"
width="12"
depth="12"
height="0.25">
</a-box>
<a-mixin
id="treetrunk"
material="src: #bark; repeat: 1 2"
geometry="radius:0.2; height:3">
'</a-mixin>
<a-cylinder
mixin="treetrunk"
position="-8 1 -7">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="-3 1 -1">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="8 1 -6">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="4 1 -2">
</a-cylinder>
<a-mixin
id="conicaltreeleaves"
material="src: #pine-needles; repeat: 3 2"
geometry="radius-bottom:1; height:3">
</a-mixin>
<a-cone
mixin="conicaltreeleaves"
position="-8 2.25 -7">
</a-cone>
<a-cone
mixin="conicaltreeleaves"
position="4 2.25 -2">
</a-cone>
<a-mixin
id="conicaltreeleaves"
material="src: #pine-needles; repeat: 3 2"
geometry="radius-bottom:1; height:3">
</a-mixin>
<a-cone
mixin="conicaltreeleaves"
position="-8 2.25 -7">
</a-cone>
<a-cone
mixin="conicaltreeleaves"
position="4 2.25 -2">
</a-cone>
<a-mixin
id="sphericaltreeleaves"
material="src: #leaves; repeat: 3 2"
geometry="radius:1">
</a-mixin>
<a-sphere
mixin="sphericaltreeleaves"
position="-3 2 -1">
</a-sphere>
<a-sphere
mixin="sphericaltreeleaves"
position="8 2 -6">
</a-sphere>
<!-- Training area sign above the front door -->
<a-box color="#3b4a2f" position="0 2.68 -5.9" width="3" height="0.36" depth="0.05"></a-box>
<a-text value="TRAINING AREA" position="0 2.68 -5.87" align="center" color="#ffffff" width="5"></a-text>
<a-mixin
id="tabletop"
color="#5c4033"
geometry="height:0.05">
</a-mixin>
<a-mixin
id="tableleg"
color="#3e2b22"
geometry="radius:0.04; height:0.85">
</a-mixin>
<a-mixin
id="gunmetal"
color="#2f3330">
</a-mixin>
<a-mixin
id="gunstock"
color="#4b5320">
</a-mixin>
<!-- Weapons table -->
<a-box mixin="tabletop" position="-2 0.925 -12" width="2" depth="1"></a-box>
<a-cylinder mixin="tableleg" position="-2.92 0.475 -12.42"></a-cylinder>
<a-cylinder mixin="tableleg" position="-2.92 0.475 -11.58"></a-cylinder>
<a-cylinder mixin="tableleg" position="-1.08 0.475 -12.42"></a-cylinder>
<a-cylinder mixin="tableleg" position="-1.08 0.475 -11.58"></a-cylinder>
<a-entity class="rifle" position="-2.3 0.985 -12.2" rotation="90 10 0">
  <a-box mixin="gunmetal" position="0 0 0" width="0.5" height="0.12" depth="0.06"></a-box>
  <a-box mixin="gunstock" position="-0.38 -0.02 0" width="0.3" height="0.14" depth="0.05"></a-box>
  <a-box mixin="gunmetal" position="0.35 0 0" width="0.25" height="0.08" depth="0.07"></a-box>
  <a-cylinder mixin="gunmetal" position="0.58 0.01 0" rotation="0 0 90" radius="0.015" height="0.3"></a-cylinder>
  <a-box mixin="gunmetal" position="0.08 -0.14 0" rotation="0 0 -10" width="0.07" height="0.18" depth="0.04"></a-box>
  <a-box mixin="gunstock" position="-0.13 -0.1 0" rotation="0 0 15" width="0.05" height="0.12" depth="0.04"></a-box>
  <a-cylinder mixin="gunmetal" position="0 0.1 0" rotation="0 0 90" radius="0.025" height="0.22"></a-cylinder>
</a-entity>
<a-entity class="rifle" position="-1.9 0.985 -11.75" rotation="90 -8 0">
  <a-box mixin="gunmetal" position="0 0 0" width="0.5" height="0.12" depth="0.06"></a-box>
  <a-box mixin="gunstock" position="-0.38 -0.02 0" width="0.3" height="0.14" depth="0.05"></a-box>
  <a-box mixin="gunmetal" position="0.35 0 0" width="0.25" height="0.08" depth="0.07"></a-box>
  <a-cylinder mixin="gunmetal" position="0.58 0.01 0" rotation="0 0 90" radius="0.015" height="0.3"></a-cylinder>
  <a-box mixin="gunmetal" position="0.08 -0.14 0" rotation="0 0 -10" width="0.07" height="0.18" depth="0.04"></a-box>
  <a-box mixin="gunstock" position="-0.13 -0.1 0" rotation="0 0 15" width="0.05" height="0.12" depth="0.04"></a-box>
  <a-cylinder mixin="gunmetal" position="0 0.1 0" rotation="0 0 90" radius="0.025" height="0.22"></a-cylinder>
</a-entity>
<a-entity class="pistol" position="-1.4 0.965 -12.25" rotation="90 30 0">
  <a-box mixin="gunmetal" position="0 0 0" width="0.2" height="0.05" depth="0.03"></a-box>
  <a-box mixin="gunmetal" position="-0.06 -0.06 0" rotation="0 0 -12" width="0.05" height="0.11" depth="0.03"></a-box>
</a-entity>
<a-entity
gltf-model="#chair"
position="-2 0 -13.25"
rotation="0 -90 0"
scale="0.15 0.15 0.15">
</a-entity>
<a-entity
gltf-model="#chair"
position="-2 0 -10.75"
rotation="0 90 0"
scale="0.15 0.15 0.15">
</a-entity>
<!-- Tablet table -->
<a-box mixin="tabletop" position="2.5 0.925 -12" width="1.6" depth="0.9"></a-box>
<a-cylinder mixin="tableleg" position="1.78 0.475 -12.37"></a-cylinder>
<a-cylinder mixin="tableleg" position="1.78 0.475 -11.63"></a-cylinder>
<a-cylinder mixin="tableleg" position="3.22 0.475 -12.37"></a-cylinder>
<a-cylinder mixin="tableleg" position="3.22 0.475 -11.63"></a-cylinder>
<a-entity class="tablet" position="2.15 0.956 -12" rotation="0 10 0">
  <a-box color="#111111" width="0.26" height="0.012" depth="0.18"></a-box>
  <a-plane position="0 0.007 0" rotation="-90 0 0" width="0.23" height="0.15" material="shader: flat; color: #1e5fa8"></a-plane>
  <a-text value="TRAINING\nPLAN" position="0 0.008 0" rotation="-90 0 0" align="center" color="#ffffff" width="0.6"></a-text>
</a-entity>
<a-entity class="tablet" position="2.85 0.956 -12" rotation="0 -10 0">
  <a-box color="#111111" width="0.26" height="0.012" depth="0.18"></a-box>
  <a-plane position="0 0.007 0" rotation="-90 0 0" width="0.23" height="0.15" material="shader: flat; color: #1e5fa8"></a-plane>
  <a-text value="TRAINING\nPLAN" position="0 0.008 0" rotation="-90 0 0" align="center" color="#ffffff" width="0.6"></a-text>
</a-entity>
<!-- Soldier standing guard outside the door -->
<a-entity gltf-model="#soldier" position="1.5 0 -4.6" rotation="0 180 0"></a-entity>
<!-- Lantern post beside the door -->
<a-entity gltf-model="#lantern" position="-1.6 0 -5.4" scale="0.06 0.06 0.06"></a-entity>
<!-- Gear on the tablet table -->
<a-entity gltf-model="#helmet" position="2.5 1.085 -12.28" scale="0.15 0.15 0.15"></a-entity>
<a-entity gltf-model="#water-bottle" position="2 1.08 -11.7"></a-entity>
<a-entity gltf-model="#radio" position="3.05 1.145 -12.25" scale="20 20 20"></a-entity>
</a-scene>
</body>
                    </html>
