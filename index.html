<!DOCTYPE html>
<html>
    <head>
         <title>A-Frame Primitives</title>
        
        <script src= "https://aframe.io/releases/1.8.0/aframe.min.js"> </script>
    </head>
    <body>
         <a-scene> 
         <a-box
         color="brown"
         position="-10 10 -16"
         rotation="0 90 0"
         width="4"
         height="4"
         depth="4">
        </a-box> 
      <a-cone
      color="blue"
      position="-10 0 -9"
      rotation="-45 0 0"
      radius-bottom="3"
      height="3">
    </a-cone>
<a-sphere
color="green"
position="0 5 -16"
radius="1.5">
</a-sphere>
<a-cylinder
color="blue"
position="5 5 -8"
rotation="45 0 0"
radius="1"
height="3">
</a-cylinder>
<a-plane
color="purple"
position="0 0 -8"
rotation="-60 0 0"
width="2"
height="2">
</a-plane>
<a-text
value="Hello, Dr Sause! This is Owen, i love learning to code"
color="white"
position="-6 0 -8"
width="16">
</a-text>

    <a-sky
color="black">
</a-sky>
</a-scene>
         </body>
     </html>
